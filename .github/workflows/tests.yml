name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^12.5'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.5'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^13.4'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: composer validate --strict --no-check-lock
      - name: Install compatible dependencies
        run: >-
          composer update --no-interaction --prefer-dist --no-progress
          --with 'laravel/framework:${{ matrix.laravel }}'
          --with 'orchestra/testbench:${{ matrix.testbench }}'
          --with 'phpunit/phpunit:${{ matrix.phpunit }}'
      - run: composer test
      - run: composer audit
